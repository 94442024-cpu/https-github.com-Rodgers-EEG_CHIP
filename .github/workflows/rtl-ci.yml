name: RTL CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cocotb
        run: python -m pip install -r tb/requirements.txt
      - name: Install RTL simulator
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Run Python golden-model tests
        run: python -m unittest discover -s models/golden -p 'test_rv32i_model.py' -v
      - name: Run convolution golden-model tests
        run: python -m unittest discover -s models/golden -p 'test_convolution_model.py' -v
      - name: Compile and run RTL unit test
        run: |
          mkdir -p sim/build
          iverilog -g2012 -o sim/build/test_alu_regfile \
            rtl/core/alu.v rtl/core/regfile.v tb/core/test_alu_regfile.v
          vvp sim/build/test_alu_regfile
      - name: Compile and run control-unit test
        run: |
          iverilog -g2012 -o sim/build/test_control \
            rtl/core/control.v tb/core/test_control.v
          vvp sim/build/test_control
      - name: Compile and run immediate-generator test
        run: |
          iverilog -g2012 -o sim/build/test_imm_gen \
            rtl/core/imm_gen.v tb/core/test_imm_gen.v
          vvp sim/build/test_imm_gen
      - name: Compile and run core smoke test
        run: |
          iverilog -g2012 -o sim/build/test_riscv_core \
            rtl/core/alu.v rtl/core/regfile.v rtl/core/control.v \
            rtl/core/imm_gen.v rtl/core/instr_mem.v rtl/core/data_mem.v \
            rtl/core/riscv_core.v tb/core/test_riscv_core.v
          vvp sim/build/test_riscv_core
      - name: Run cocotb core regression
        working-directory: tb/core
        run: make
      - name: Compile and run bus interconnect test
        run: |
          iverilog -g2012 -o sim/build/test_wishbone_interconnect \
            rtl/bus/wishbone_interconnect.v tb/bus/test_wishbone_interconnect.v
          vvp sim/build/test_wishbone_interconnect
      - name: Compile and run Wishbone RAM test
        run: |
          iverilog -g2012 -o sim/build/test_wishbone_ram \
            rtl/bus/wishbone_ram.v tb/bus/test_wishbone_ram.v
          vvp sim/build/test_wishbone_ram
      - name: Compile and run Wishbone master bridge test
        run: |
          iverilog -g2012 -o sim/build/test_wishbone_master_bridge \
            rtl/bus/wishbone_master_bridge.v tb/bus/test_wishbone_master_bridge.v
          vvp sim/build/test_wishbone_master_bridge
      - name: Compile and run accelerator register test
        run: |
          iverilog -g2012 -o sim/build/test_convolution_accel_regs \
            rtl/accelerator/convolution_accel_regs.v tb/bus/test_convolution_accel_regs.v
          vvp sim/build/test_convolution_accel_regs
      - name: Compile and run convolution stream test
        run: |
          iverilog -g2012 -o sim/build/test_convolution_stream \
            rtl/accelerator/convolution_stream.v tb/bus/test_convolution_stream.v
          vvp sim/build/test_convolution_stream
      - name: Compile and run configured accelerator stream test
        run: |
          iverilog -g2012 -o sim/build/test_convolution_accelerator \
            rtl/accelerator/convolution_accel_regs.v rtl/accelerator/convolution_stream.v \
            rtl/accelerator/convolution_accelerator.v tb/bus/test_convolution_accelerator.v
          vvp sim/build/test_convolution_accelerator
      - name: Compile and run DMA controller test
        run: |
          iverilog -g2012 -o sim/build/test_dma_controller \
            rtl/bus/dma_controller.v tb/bus/test_dma_controller.v
          vvp sim/build/test_dma_controller
      - name: Compile and run RISC-V Wishbone system test
        run: |
          iverilog -g2012 -o sim/build/test_riscv_wb_system \
            rtl/core/alu.v rtl/core/regfile.v rtl/core/control.v rtl/core/imm_gen.v \
            rtl/core/instr_mem.v rtl/core/data_mem.v rtl/core/riscv_core.v \
            rtl/core/riscv_wb_system.v rtl/bus/wishbone_master_bridge.v \
            rtl/bus/wishbone_interconnect.v rtl/bus/wishbone_ram.v \
            tb/bus/test_riscv_wb_system.v
          vvp sim/build/test_riscv_wb_system
